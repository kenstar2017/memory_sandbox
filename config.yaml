# 记忆沙箱配置（生产可用默认值）

sensory:
  ttl: 3.0                    # 感觉记忆 TTL（秒）

working:
  chunk_size: 7               # 工作记忆窗口大小（7±2）
  idle_clear_seconds: 600     # 对话空闲后清空（秒）

long_term:
  similarity_threshold: 0.70  # 相似度命中阈值
  top_k: 3                    # 召回条数
  persist_dir: data/memory    # 持久化目录
  reinforce_boost: 0.05       # 重复命中权重提升
  bm25_enabled: true          # 启用 BM25，和向量/关键词一起搜
  vector_weight: 0.55
  keyword_weight: 0.20
  bm25_weight: 0.25
  aging_enabled: true         # 很久没用的记忆检索时略降权
  aging_days: 90
  aging_min_hits: 0
  aging_decay: 0.15

embedding:
  dim: 256                    # 本地哈希向量维度（改后请跑 reoptimize）

llm:
  enabled: true               # 沙箱无解时是否调用大模型
  provider: mock              # mock | cursor | openai_compatible
  # cursor：密钥请写到 ~/Library/Application Support/MemorySandbox/config.yaml 或环境变量
  # openai_compatible：OpenAI 兼容网关
  base_url: ""                # cursor cloud 默认 https://api.cursor.com；openai 填网关 /v1
  api_key: ""
  # cursor 可空（用账号默认）。要指定：写 agent CLI 认的名字，
  # 如 claude-opus-5-thinking-high / composer-2.5；名字错了不会提前报错，
  # 只会在真正回退调模型那一刻失败，改完最好用一句话试一次
  model: ""
  timeout: 600                # 本地 agent / cloud 建议 300~600
  cwd: ""                     # 空 = 启动时的 cwd；可填项目绝对路径
  runtime: local              # local=本机 agent 可读盘 | cloud=Cloud 无仓库
  agent_bin: ""               # 空则 PATH 找 agent / cursor-agent
  agent_mode: ask             # ask=只读 | plan=规划 | 空=Agent 全工具（建议用 CLI/网页切换）
  agent_force: false          # Agent 可写时是否 --force（CLI/网页切到 agent 会自动打开）
  approve_mcps: false         # Cursor MCP 自动批准（飞书读文档请用下方 feishu，不必改 Cursor）

# 飞书读写文档（说明见 README_zh.md「飞书文档读写」）
# 密钥写到 Application Support 用户配置，勿提交 git。
# 接入：配 app_id/secret → 开放平台加 redirect_uri → python3 scripts/feishu_login.py
# 写能力（改标题、新建文档、改正文）每次都需本人确认，见 .cursor/rules/memory-sandbox.mdc
feishu:
  enabled: false
  app_id: ""
  app_secret: ""
  user_access_token: ""       # OAuth 写入，勿手抄
  refresh_token: ""           # OAuth 写入，用于续期
  redirect_uri: "http://127.0.0.1:18765/feishu/callback"
  api_base: "https://open.feishu.cn"
  doc_host: ""                # 如 bytedance.larkoffice.com；用于把新建文档拼成可点链接
  timeout: 30
  max_chars: 80000
  # 飞书机器人白名单（open_id）。留空 = 不服务任何人，只回对方自己的 open_id；
  # 机器人默认全公司都能私聊，不设白名单等于把个人记忆库对全员开放
  bot_allow_open_ids: []
  bot_llm_timeout: 150        # 机器人问模型的超时上限（秒）；llm.timeout 更短则用更短的
  # 文档评论机器人：被 @ 时在评论串里回答，要改正文先提方案等你回「确认」。
  # 默认关：评论对整篇文档的协作者可见，且署名是你本人（评论接口只能用 user token）。
  # 打开前先重跑 python3 scripts/feishu_login.py 授权 docs:event:subscribe
  doc_bot_enabled: false
  doc_bot_trigger: "@BloomBot"   # 评论正文含这个词才响应
  doc_bot_ack_after_seconds: 8   # 超过这么久还没算完，先回一条「收到」

sandbox:
  # 开发场景标签，用于情境依赖回忆
  default_scene: general
