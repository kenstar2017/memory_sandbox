# 记忆沙箱配置（生产可用默认值）

sensory:
  ttl: 3.0                    # 感觉记忆 TTL（秒）

working:
  chunk_size: 7               # 工作记忆窗口大小（7±2）
  idle_clear_seconds: 600     # 对话空闲后清空（秒）

long_term:
  similarity_threshold: 0.70  # 相似度命中阈值
  top_k: 3                    # 召回条数
  persist_dir: data/memory    # 持久化目录
  reinforce_boost: 0.05       # 重复命中权重提升

embedding:
  dim: 256                    # 本地哈希向量维度

llm:
  enabled: true               # 沙箱无解时是否调用大模型
  provider: mock              # mock | cursor | openai_compatible
  # cursor：密钥请写到 ~/Library/Application Support/MemorySandbox/config.yaml 或环境变量
  # openai_compatible：OpenAI 兼容网关
  base_url: ""                # cursor cloud 默认 https://api.cursor.com；openai 填网关 /v1
  api_key: ""
  model: ""                   # cursor 可空（用账号默认）；或 composer-2 / composer-2.5 等
  timeout: 600                # 本地 agent / cloud 建议 300~600
  cwd: ""                     # 空 = 启动时的 cwd；可填项目绝对路径
  runtime: local              # local=本机 agent 可读盘 | cloud=Cloud 无仓库
  agent_bin: ""               # 空则 PATH 找 agent / cursor-agent
  agent_mode: ask             # ask=只读 | plan=规划 | 空=Agent 全工具（建议用 CLI/网页切换）
  agent_force: false          # Agent 可写时是否 --force（CLI/网页切到 agent 会自动打开）
  approve_mcps: false         # Cursor MCP 自动批准（飞书读文档请用下方 feishu，不必改 Cursor）

# 飞书读文档（说明见 README_zh.md「飞书文档读取」）
# 密钥写到 Application Support 用户配置，勿提交 git。
# 接入：配 app_id/secret → 开放平台加 redirect_uri → python3 scripts/feishu_login.py
feishu:
  enabled: false
  app_id: ""
  app_secret: ""
  user_access_token: ""       # OAuth 写入，勿手抄
  refresh_token: ""           # OAuth 写入，用于续期
  redirect_uri: "http://127.0.0.1:18765/feishu/callback"
  api_base: "https://open.feishu.cn"
  timeout: 30
  max_chars: 80000

sandbox:
  # 开发场景标签，用于情境依赖回忆
  default_scene: general
