[package]
name = "memory_sandbox"
version = "0.1.0"
description = "BloomBox desktop"
authors = ["BloomBox"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "memory_sandbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "BloomBox"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
