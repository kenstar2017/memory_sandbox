# 记忆沙箱配置（生产可用默认值）

sensory:
  ttl: 3.0                    # 感觉记忆 TTL（秒）

working:
  chunk_size: 7               # 工作记忆窗口大小（7±2）
  idle_clear_seconds: 600     # 对话空闲后清空（秒）

long_term:
  similarity_threshold: 0.70  # 相似度命中阈值
  top_k: 3                    # 召回条数
  persist_dir: data/memory    # 持久化目录
  reinforce_boost: 0.05       # 重复命中权重提升

embedding:
  dim: 256                    # 本地哈希向量维度

llm:
  enabled: true               # 沙箱无解时是否调用大模型
  provider: mock              # mock | cursor | openai_compatible
  # cursor：用 CURSOR_API_KEY（crsr_...）走 Cloud Agents；密钥请写到
  # ~/Library/Application Support/MemorySandbox/config.yaml 或环境变量，勿提交仓库
  # openai_compatible：OpenAI 兼容网关
  base_url: ""                # cursor 默认 https://api.cursor.com；openai 填网关 /v1
  api_key: ""
  model: ""                   # cursor 可空（用账号默认）；或 composer-2 / composer-2.5 等
  timeout: 300                # cursor 云端 Agent 建议 180~300
  cwd: ""                     # 可选：cursor-sdk 本地 Agent 工作目录

sandbox:
  # 开发场景标签，用于情境依赖回忆
  default_scene: general
